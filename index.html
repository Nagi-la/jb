<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MagicRule</title><style>:root{--bg:#151210;--surface:#1f1a14;--border:#322a1e;--text:#f0e9dd;--soft:#c4b8a5;--primary:#f5a93b}*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--text)}body{background:linear-gradient(160deg,#1d1712,#131110);line-height:1.6}.app{min-height:100vh}.header{height:66px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#181410dd;backdrop-filter:blur(10px);position:sticky;top:0;z-index:2}.brand{font-size:21px;font-weight:900}.brand b{color:var(--primary)}button{border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:6px;padding:9px 12px;cursor:pointer}.main{max-width:600px;margin:auto;padding:22px 16px 40px}.title{font-size:28px;margin:0 0 6px}.sub{color:var(--soft);margin:0 0 24px}.list{display:grid;gap:12px}.card{display:flex;align-items:center;gap:14px;min-height:78px;padding:14px 16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;text-decoration:none;transition:.15s}.card:hover{border-color:var(--primary);transform:translateY(-1px)}.logo{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;color:#21170a;font-size:22px;font-weight:900;background:linear-gradient(135deg,#fdba2d,#f59e0b)}.copy{flex:1;font-weight:800}.arrow{font-size:28px;color:#8a7e6b}@media(min-width:821px){.header{max-width:900px;margin:auto;border:0}.main{padding-top:40px}}</style></head><body><div id="app"><header class="header"><div class="brand">Magic<b>Rule</b></div><button id="theme">☀️</button></header><main class="main"><h1 class="title">选择客户端</h1><p class="sub">选择你使用的客户端，搜索并订阅对应格式的规则。</p><div class="list" id="list"></div></main></div><script>const clients=['AdGuard','Egern','Loon','Mihomo','QuantumultX','Shadowrocket','SingBox','Stash','Surfboard','Surge'];const list=document.querySelector('#list');clients.forEach(name=>{const a=document.createElement('a');a.className='card';a.href='#/'+name.toLowerCase();a.innerHTML='<span class="logo">'+name[0]+'</span><span class="copy">'+name+'</span><span class="arrow">›</span>';list.append(a)});document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';document.documentElement.style.setProperty('--bg',dark?'#f4f3f1':'#151210');document.documentElement.style.setProperty('--surface',dark?'#fff':'#1f1a14');document.documentElement.style.setProperty('--text',dark?'#201b14':'#f0e9dd');document.documentElement.style.setProperty('--border',dark?'#ece5d8':'#322a1e');document.body.style.background=dark?'#f4f3f1':'linear-gradient(160deg,#1d1712,#131110)'};</script></body></html>
